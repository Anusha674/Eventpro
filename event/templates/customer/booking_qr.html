{% extends "base.html" %}
{% block title %}Booking QR Code{% endblock %}

{% block content %}
<div style="padding-top: 100px;"></div>
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="glass-card p-4 text-center">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px; background: rgba(79,70,229,0.1);">
                        <i class="bi bi-qr-code" style="font-size: 2rem; color: var(--primary);"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Booking #{{ booking.B_ID }}</h3>
                    <p class="text-muted mb-4">{{ booking.Event_Name }}</p>

                    <div class="d-inline-block p-3 rounded-3 mb-4" style="background: white;">
                        <img
                            src="data:image/png;base64,{{ qr_base64 }}"
                            alt="QR code for booking #{{ booking.B_ID }}"
                            class="img-fluid"
                            style="max-width: 280px; width: 100%; height: auto;"
                        >
                    </div>

                    <p class="text-muted mb-4">Scan this QR code at the event entrance.</p>
                    <a href="{{ url_for('my_bookings') }}" class="btn btn-outline-custom">
                        <i class="bi bi-arrow-left me-2"></i>Back to Bookings
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
