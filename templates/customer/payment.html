{% extends "base.html" %}
{% block title %}Payment{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/payment.js') }}"></script>{% endblock %}

{% block content %}
<div style="padding-top: 100px;"></div>
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px; background: rgba(5,150,105,0.1);">
                            <i class="bi bi-credit-card" style="font-size: 2rem; color: var(--success);"></i>
                        </div>
                        <h3 class="fw-bold">Make Payment</h3>
                        <p class="text-muted">Booking #{{ booking.B_ID }} - {{ booking.Event_Name }}</p>
                    </div>

                    <div class="p-3 rounded-3 mb-4" style="background: var(--gray-50);">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Event</span>
                            <strong>{{ booking.Event_Name }}</strong>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Amount</span>
                            <strong style="font-size: 1.3rem; color: var(--primary);">₹{{ '{:,.0f}'.format(booking.Amount) }}</strong>
                        </div>
                    </div>

                    <form method="POST" action="{{ url_for('payment', booking_id=booking.B_ID) }}" id="paymentForm">
                        <div class="mb-3">
                            <label class="form-label-custom">Payment Mode</label>
                            <select name="mode" class="form-select form-control-custom" id="paymentMode" required>
                                <option value="UPI">UPI</option>
                                <option value="Card">Card</option>
                                <option value="Net Banking">Net Banking</option>
                                <option value="Cash">Cash</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success-custom w-100 btn-lg">
                            <i class="bi bi-shield-check me-2"></i>Pay ₹{{ '{:,.0f}'.format(booking.Amount) }}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
