{% set hide_navbar = true %}
{% set hide_footer = true %}
{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-logo">✦ EventPro</span>
            <h2>Welcome Back</h2>
            <p>Sign in to your account</p>
        </div>

        <!-- Role Toggle -->
        <div class="role-toggle" id="roleToggle">
            <button class="active" onclick="toggleRole('customer', this)">Customer</button>
            <button onclick="toggleRole('admin', this)">Admin</button>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="role" id="roleInput" value="customer">
            <div class="form-group">
                <label class="form-label">Email / Username</label>
                <input type="text" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-auth">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <div class="auth-toggle">
            Don't have an account? <a href="{{ url_for('register') }}">Create Account</a>
        </div>
        <div class="text-center mt-3">
            <a href="{{ url_for('home') }}" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </div>
    </div>
</div>

<script>
function toggleRole(role, btn) {
    document.getElementById('roleInput').value = role;
    document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
</script>
{% endblock %}
